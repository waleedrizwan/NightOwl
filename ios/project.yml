name: NightOwl
options:
  bundleIdPrefix: com.waleedrizwan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  NightOwlAnalysis:
    path: Packages/NightOwlAnalysis

targets:
  NightOwl:
    type: application
    platform: iOS
    sources:
      - NightOwl
    dependencies:
      - package: NightOwlAnalysis
        product: NightOwlAnalysis
    entitlements:
      path: NightOwl/NightOwl.entitlements
      properties:
        aps-environment: development
    info:
      path: NightOwl/Info.plist
      properties:
        CFBundleDisplayName: Night Owl
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: Night
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - remote-notification
        # "I'm up" fetches the night straight from the Pi's file server
        # (recorder/serve.py), plain HTTP on the home network.
        NSLocalNetworkUsageDescription: >-
          Night Owl downloads last night's recording from your bedside Pi over
          your home Wi-Fi and analyzes it on this iPhone.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waleedrizwan.NightOwl
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CCY6PYVHZW
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
